# Re-render README.md from README.Rmd, derived from
# https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    paths: ['README.Rmd', 'R/**', 'data/**']
  workflow_dispatch:

name: render-readme.yaml

permissions: read-all

jobs:
  render-readme:
    runs-on: ubuntu-latest
    # one render at a time, so commits do not conflict
    concurrency:
      group: render-readme
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown, local::.

      - name: Render README
        run: Rscript -e 'rmarkdown::render("README.Rmd")'

      - name: Commit README
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add README.md man/figures
          git diff --cached --quiet || git commit -m "Re-render README.md"
          git pull --rebase
          git push
